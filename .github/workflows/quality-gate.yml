name: Quality Gate Inicial

on:
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: analizador_app
          POSTGRES_PASSWORD: analizador_ci
          POSTGRES_DB: analizador
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://analizador_app:analizador_ci@localhost:5432/analizador
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate required documentation
        run: |
          test -f README.md
          test -f docs/quality/CTQ.md
          test -f docs/quality/DoD.md

      - name: Check Markdown basic quality
        run: |
          echo "Validando documentación Markdown..."
          grep -q "CTQ" docs/quality/CTQ.md
          grep -q "Definition of Done" docs/quality/DoD.md

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
