name: Quality Gate Inicial

on:
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate required documentation
        run: |
          test -f README.md
          test -f docs/quality/CTQ.md
          test -f docs/quality/DoD.md

      - name: Check Markdown basic quality
        run: |
          echo "Validando documentación Markdown..."
          grep -q "CTQ" docs/quality/CTQ.md
          grep -q "Definition of Done" docs/quality/DoD.md

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
