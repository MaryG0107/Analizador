name: Quality Gate Inicial

on:
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required documentation
        run: |
          test -f README.md
          test -f docs/quality/CTQ.md
          test -f docs/quality/DoD.md

      - name: Check Markdown basic quality
        run: |
          echo "Validando documentación Markdown..."
          grep -q "CTQ" docs/quality/CTQ.md
          grep -q "Definition of Done" docs/quality/DoD.md

      - name: Optional project test command
        run: |
          echo "Agregar aquí npm test, pytest, dotnet test, mvn test, etc."
          echo "Gate inicial completado"
